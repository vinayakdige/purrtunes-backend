version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: purrtunes_app_dev
    restart: always
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: https://turrndwwcxiawzpkzrbt.supabase.co
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
